[package]
name = "fetcher"
version = "0.1.4"
edition = "2021"
rust-version = "1.96"

[dependencies]
teloxide = { version = "0.17.0", features = ["macros"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "process", "sync", "time"] }
log = "0.4.35"
pretty_env_logger = "0.5.0"
regex = "1.13.1"
uuid = { version = "1.29.0", features = ["v4"] }
dotenvy = "0.15.7"
# Match the reqwest client type used by teloxide 0.17.
reqwest = "0.12.28"
dirs = "7.0.0"
serde_json = "1.0.154"
