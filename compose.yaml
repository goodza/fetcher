services:
  telegram-bot-api:
    image: aiogram/telegram-bot-api:10.3@sha256:b6284d77c46e0e1f7bb47bb074760517d9e69c5c61f0fa8f1887591aea323172
    container_name: telegram-bot-api
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: "${API_ID:?API_ID must be set in .env}"
      TELEGRAM_API_HASH: "${API_HASH:?API_HASH must be set in .env}"
      TELEGRAM_LOCAL: "1"
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - telegram-bot-api-data:/var/lib/telegram-bot-api

volumes:
  telegram-bot-api-data:
